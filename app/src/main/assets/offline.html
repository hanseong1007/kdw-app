<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연결할 수 없습니다</title>
<style>
  :root { --brand:#1b5e20; --ink:#16241a; --muted:#6b7c70; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:#f1f4f2; color:var(--ink);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    padding:24px;
  }
  .card {
    width:100%; max-width:360px; background:#fff; border:1px solid #e3e9e5;
    border-radius:20px; padding:26px 22px; text-align:center;
    box-shadow:0 8px 24px rgba(16,32,22,.06);
  }
  .mark {
    width:56px; height:56px; margin:0 auto 14px; border-radius:18px;
    background:var(--brand); color:#fff; display:grid; place-items:center;
    font-size:20px; font-weight:800; letter-spacing:-1px;
  }
  h1 { margin:0 0 8px; font-size:18px; letter-spacing:-.4px; }
  p { margin:0 0 18px; font-size:13.5px; line-height:1.6; color:var(--muted); }
  button {
    width:100%; height:48px; border:0; border-radius:13px;
    background:var(--brand); color:#fff; font-size:15.5px; font-weight:800;
    font-family:inherit;
  }
  button:active { transform:translateY(1px); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">경</div>
    <h1>인터넷에 연결할 수 없습니다</h1>
    <p>와이파이나 모바일 데이터가 켜져 있는지 확인한 뒤<br>다시 시도해 주세요.</p>
    <button type="button" onclick="retry()">다시 시도</button>
  </div>
<script>
  function retry() {
    try { if (window.KdwApp && window.KdwApp.reload) { window.KdwApp.reload(); return; } } catch (e) {}
    if (window.KdwApp && window.KdwApp.startUrl) {
      location.replace(window.KdwApp.startUrl());
      return;
    }
    location.replace('https://hanseong1007.github.io/');
  }
</script>
</body>
</html>
