plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kdw.portal'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // 빌드마다 서명 키가 바뀌면 새 APK 가 이전 앱 위에 설치되지 않습니다
    // (설치되어 있던 발주·근태 기록도 지워집니다). 그래서 서명 키를 저장소에 고정해 두었습니다.
    signingConfigs {
        kdw {
            storeFile rootProject.file('keystore/kdw.jks')
            storePassword 'kdwapp2026'
            keyAlias 'kdw'
            keyPassword 'kdwapp2026'
        }
    }

    flavorDimensions 'app'

    productFlavors {
        // 통합 포털: 발주화면 · 업무일지 · 근태 3개 앱으로 들어가는 로그인/대시보드
        portal {
            dimension 'app'
            applicationId 'com.kdw.portal'
            resValue 'string', 'app_name', '경덕농수산'
            resValue 'string', 'start_url', 'https://hanseong1007.github.io/'
        }
        // 업무일지 전용
        worklog {
            dimension 'app'
            applicationId 'com.kdw.worklog'
            resValue 'string', 'app_name', '경덕 업무일지'
            resValue 'string', 'start_url', 'https://hanseong1007.github.io/worklog-app/'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.kdw
        }
        release {
            // 사내 배포용이라 debug 와 같은 고정 키로 서명합니다.
            // 나중에 정식 키를 만들면 signingConfigs.kdw 를 새 키로 바꾸면 됩니다.
            minifyEnabled false
            signingConfig signingConfigs.kdw
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
