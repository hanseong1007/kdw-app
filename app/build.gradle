plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kdw.portal'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    flavorDimensions 'app'

    productFlavors {
        // 통합 포털: 발주화면 · 업무일지 · 근태 3개 앱으로 들어가는 로그인/대시보드
        portal {
            dimension 'app'
            applicationId 'com.kdw.portal'
            resValue 'string', 'app_name', '경덕농수산'
            resValue 'string', 'start_url', 'https://hanseong1007.github.io/'
        }
        // 업무일지 전용
        worklog {
            dimension 'app'
            applicationId 'com.kdw.worklog'
            resValue 'string', 'app_name', '경덕 업무일지'
            resValue 'string', 'start_url', 'https://hanseong1007.github.io/worklog-app/'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // 배포용 키가 아직 없으므로 debug 키로 서명합니다(설치만 되면 되는 사내용).
            // 나중에 정식 키를 만들면 signingConfigs 를 추가하고 이 줄을 바꾸면 됩니다.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
